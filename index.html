<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COACH ISMO</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="login" class="hidden">
    <h1>COACH <span>ISMO</span></h1>
    <div class="card">
      <p class="sub">Connexion</p>
      <form id="loginForm">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit">Se connecter</button>
        <div id="loginMsg" class="msg" role="alert"></div>
      </form>
    </div>
  </section>

  <section id="shell" class="hidden">
    <header class="top">
      <h1>COACH <span>ISMO</span></h1>
      <div class="status">
        <span id="net" class="pill">…</span>
        <span id="syncpill" class="pill">…</span>
        <button id="syncbtn" class="small ghost" type="button">Synchroniser</button>
      </div>
    </header>
    <div id="app"></div>
    <footer class="foot">
      <span class="sub">Connecté : <strong id="who"></strong></span>
      <button id="logout" class="small ghost" type="button">Se déconnecter</button>
    </footer>
  </section>
  <div id="toast" class="toast hidden" role="status"></div>
</main>
<script src="supabase-lib.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
