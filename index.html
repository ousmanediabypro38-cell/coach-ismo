<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>COACH ISMO</title>
  <meta name="theme-color" content="#080b09">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login" class="login hidden">
    <div class="login-7" aria-hidden="true">7</div>
    <div class="login-panel">
      <div class="brand"><span class="mark">7</span><span class="word">COACH <b>ISMO</b></span></div>
      <h1>Connexion</h1>
      <form id="loginForm">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit" class="block">Se connecter</button>
        <div id="loginMsg" class="msg" role="alert"></div>
      </form>
    </div>
  </section>

  <div id="shell" class="app hidden">
    <header class="side-top">
      <div class="brand"><span class="mark">7</span><span class="word">COACH <b>ISMO</b></span></div>
      <div class="status">
        <span id="net" class="pill">…</span>
        <span id="syncpill" class="pill">…</span>
      </div>
    </header>

    <nav id="tabs" class="nav" aria-label="Navigation principale">
      <button type="button" data-tab="accueil" data-view="accueil" class="active"><span class="ico" data-icon="house"></span><span class="lbl">Accueil</span></button>
      <button type="button" data-tab="teams" data-view="home"><span class="ico" data-icon="users"></span><span class="lbl">Équipes</span></button>
      <button type="button" data-tab="cal" data-view="cal"><span class="ico" data-icon="calendar"></span><span class="lbl">Calendrier</span></button>
      <button type="button" data-tab="conflicts" data-view="conflicts"><span class="ico" data-icon="alert"></span><span class="lbl" id="tabconf">Conflits</span></button>
      <button type="button" data-tab="carnet" data-view="carnet"><span class="ico" data-icon="clipboard"></span><span class="lbl">Carnet</span></button>
      <button type="button" data-tab="playbook" data-view="playbook"><span class="ico" data-icon="court"></span><span class="lbl">Playbook</span></button>
      <button type="button" data-tab="oussou" data-view="oussou"><span class="ico" data-icon="ball"></span><span class="lbl">Oussou Time</span></button>
    </nav>

    <footer class="side-foot">
      <button id="syncbtn" class="ghost small block" type="button"><span class="ico" data-icon="refresh"></span>Synchroniser</button>
      <div class="who"><span class="sub" id="who"></span>
        <button id="logout" class="ghost small icononly" type="button" aria-label="Se déconnecter"><span class="ico" data-icon="logout"></span></button></div>
    </footer>
    <div class="big7" aria-hidden="true">7</div>

    <main class="content"><div id="app"></div></main>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>

<script src="supabase-lib.js"></script>
<script src="config.js"></script>
<script src="icons.js"></script>
<script src="db.js"></script>
<script src="sync.js"></script>
<script src="conflicts.js"></script>
<script src="calendar.js"></script>
<script src="carnet.js"></script>
<script src="oussou.js"></script>
<script src="venues.js"></script>
<script src="matchs.js"></script>
<script src="suivi.js"></script>
<script src="schemas.js"></script>
<script src="logos.js"></script>
<script src="convoc.js"></script>
<script src="playbook.js"></script>
<script src="backup.js"></script>
<script src="accueil.js"></script>
<script src="importer.js"></script>
<script src="app.js"></script>
</body>
</html>
